<!doctype html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="keywords" content="{{KEYWORDS}}">
  <meta name="robots" content="index,follow,max-snippet:-1">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="alternate" hreflang="zh-CN" href="{{ZH_URL}}">
  <link rel="alternate" hreflang="en" href="{{EN_URL}}">
  <link rel="alternate" hreflang="x-default" href="{{ROOT_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{SEO_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <main>
    <article>
      <header class="hero">
        <nav class="top-nav" aria-label="{{LANGUAGE_NAV_LABEL}}">{{LANGUAGE_NAV}}</nav>
        <p class="eyebrow">{{EYEBROW}}</p>
        <h1>{{SHORT_TITLE}}</h1>
        <p class="summary">{{DESCRIPTION}}</p>
        <p class="updated">{{UPDATED_LABEL}} <time datetime="{{UPDATED_AT}}">{{UPDATED_AT}}</time></p>
        <div class="stats">{{STATS}}</div>
      </header>
      <section class="answer" aria-labelledby="answer-title">
        <h2 id="answer-title">{{ANSWER_TITLE}}</h2>
        <p>{{ANSWER_TEXT}}</p>
      </section>
      {{SECTIONS}}
      <section class="notice" aria-labelledby="notice-title">
        <h2 id="notice-title">{{NOTICE_TITLE}}</h2>
        <p>{{NOTICE_TEXT}}</p>
      </section>
      <footer class="footer">
        <a href="../data/ai-free-quotas.json">{{DATA_LABEL}}</a>
        <span aria-hidden="true"> · </span>{{FOOTER_TEXT}}
      </footer>
    </article>
  </main>
</body>
</html>
